spring.application.name=garden-empire-server
server.port=8080

# ── Clever Cloud PostgreSQL Database Configuration ─────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://bqwuh4v61xfkejuknnjw-postgresql.services.clever-cloud.com:50013/bqwuh4v61xfkejuknnjw?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:u9ktwqnnume4ljvmygtm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD_HERE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate Settings ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Hikari Connection Pool (Optimized for Clever Cloud Free Tier) ─────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.gardenempire=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
