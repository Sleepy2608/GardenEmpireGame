networks:
  garden-network:
    driver: bridge

services:
  # ── Spring Boot Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: garden-backend
    networks:
      - garden-network
    ports:
      - "8080:8080"        # Direct access for debugging (optional)
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8080/api/rooms"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s   # Give Spring Boot time to start
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # ── Nginx Frontend (Static + Reverse Proxy) ──────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: garden-frontend
    networks:
      - garden-network
    ports:
      - "3000:80"          # Access game at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy   # Wait until backend passes healthcheck
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
